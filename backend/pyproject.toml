[project]
name = "paperless-llm"
version = "0.1.0"
description = "Local-LLM metadata pipeline and taxonomy governance for paperless-ngx"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    # Imported directly in app/api/errors.py; version is constrained by fastapi.
    "starlette>=1.3",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pydantic-ai-slim[openai]>=2",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "rapidfuzz>=3.10",
    "pypdfium2>=5.12.1",
    "pdfminer-six>=20260107",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
# psycopg (sync) runs the alembic migrations; asyncpg serves the app.
postgres = ["asyncpg>=0.30", "psycopg[binary]>=3.2"]

[project.scripts]
paperless-llm = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires the ad-hoc paperless-ngx instance (deploy/test)",
    "live_llm: requires real local LLM endpoints; opt-in only",
]
addopts = "-m 'not integration and not live_llm'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "C4", "PIE", "PTH", "RET", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Depends(...) in argument defaults is the canonical FastAPI pattern.
"app/api/**" = ["B008"]
# Tests deliberately import after env/registry setup (populate EXECUTORS,
# set PLLM_* before importing the app), so late module imports are fine.
"tests/**" = ["E402"]
# Alembic autogenerates long column-definition lines; not hand-wrapped.
"alembic/**" = ["E501"]
