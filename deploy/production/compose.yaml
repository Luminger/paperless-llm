# paperless-llm — production deployment (single app container against
# your EXISTING paperless-ngx and local LLM endpoints).
#
#   cp .env.example .env   # then edit
#   podman compose up -d
#
# Optional settings (paperless token, OCR/embeddings/reranker
# endpoints, webhook, …) live in optional.env — uncomment them THERE,
# not here (see the env_file note below for why).
#
# Privacy by construction: the app only ever talks to the endpoints
# configured here. Point them at machines on your network and no
# document data can leave it.

services:
  app:
    # Published image: :latest tracks releases; pin a version tag
    # (e.g. :0.1) or :sha-<commit> for reproducible deployments.
    # To run from source instead:
    #   podman build -f deploy/Containerfile -t paperless-llm ../..
    # and set image: paperless-llm here.
    image: ghcr.io/luminger/paperless-llm:latest
    restart: unless-stopped
    ports:
      # Loopback-only by default — expose via your reverse proxy;
      # change to 0.0.0.0 deliberately for direct LAN use.
      - "127.0.0.1:${PLLM_PORT:-8100}:8100"
    # Hardening: the container runs as a dedicated non-root user and
    # only writes /data (see deploy/Containerfile) — it needs no Linux
    # capabilities and no privilege escalation. read_only: true would
    # be a further option, but the runtime's tmp usage (Python,
    # tesseract) is unverified — if you enable it, add a tmpfs on /tmp
    # and test.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # REQUIRED settings only — everything optional lives in
      # optional.env (env_file below). A ${VAR:-} mapping here would
      # export an EMPTY STRING even when the host variable is unset;
      # the backend sees that as env-provided configuration and locks
      # the key in the Settings UI. (Even once the backend treats
      # empty env as unset, not creating the variable at all stays the
      # cleaner contract.)

      # --- paperless ------------------------------------------------
      PLLM_PAPERLESS__BASE_URL: ${PLLM_PAPERLESS_BASE_URL:?set the paperless URL}

      # --- agent LLM endpoint (OpenAI-compatible) -------------------
      PLLM_LLM__AGENT__BASE_URL: ${PLLM_AGENT_BASE_URL:?set the agent LLM URL}
      PLLM_LLM__AGENT__MODEL: ${PLLM_AGENT_MODEL:?set the agent model name}

      # --- auth -----------------------------------------------------
      # Session cookie Secure flag. Behind TLS (the expected
      # reverse-proxy setup) this must stay on; set
      # PLLM_COOKIE_SECURE=false ONLY for plain-HTTP LAN setups —
      # with it on, logins over plain HTTP won't stick.
      PLLM_AUTH__COOKIE_SECURE: ${PLLM_COOKIE_SECURE:-true}
    # Optional settings: uncomment lines in optional.env. Commented
    # lines create NO container variable at all, so unset options
    # never shadow (and UI-lock) the corresponding Settings keys.
    env_file:
      - ./optional.env
    volumes:
      - appdata:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/api/health', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 30s

volumes:
  appdata:
