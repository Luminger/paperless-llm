name: CI

# Required check for pull requests: backend (ruff + pytest) and frontend
# (typecheck + vitest + build) must pass before a PR can merge.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Sync (locked, with dev group)
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      # Unit tests only: the integration/live_llm markers need a running
      # paperless / LLM endpoint and are deselected by the default addopts.
      - name: Test (unit)
        run: uv run pytest -q tests/unit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Test (vitest)
        run: npm test
      - name: Build
        run: npm run build
