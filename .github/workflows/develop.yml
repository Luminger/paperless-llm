name: Develop image

# Every push to main builds a development container image and publishes
# it to the GitHub Container Registry:
#   ghcr.io/<repo>:develop       - moving head of main
#   ghcr.io/<repo>:sha-<commit>  - pinned, for reproducible deployments
# Releases (semver tags -> :latest and version tags) stay in release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: develop-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases the image name for ghcr.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=develop
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
